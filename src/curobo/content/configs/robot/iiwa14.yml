robot_cfg:
  kinematics:
    base_link: world
    ee_link: lbr_link_7
    urdf_path: robot/iiwa_allegro_description/iiwa14.urdf
    asset_root_path: robot/iiwa_allegro_description

    collision_link_names:
      - lbr_link_1
      - lbr_link_2
      - lbr_link_3
      - lbr_link_4
      - lbr_link_5
      - lbr_link_6
      - lbr_link_7
    collision_spheres: spheres/iiwa14.yml
    collision_sphere_buffer: 0.005

    self_collision_buffer:
      lbr_link_0: 0.0
      lbr_link_1: 0.0
      lbr_link_2: 0.0
